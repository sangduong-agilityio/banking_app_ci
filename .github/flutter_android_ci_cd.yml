name: Flutter Android CI/CD

on:
  push:
    branches:
      - feat/implement-banking-application
  pull_request:
    branches:
      - feat/implement-banking-application

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Start CI/CD pipeline
        run: echo "Starting Flutter Android CI/CD pipeline"

      - name: Checkout repository
        uses: actions/checkout@v4

      # Sets up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      # Installs Flutter and dependencies
      - name: Install Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      # Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # (Optional) Install specific CMake version if your project needs native builds
      - name: Install CMake
        run: sdkmanager "cmake;4.0.2"

      # Fetch project dependencies
      - name: Install dependencies
        run: flutter pub get

      # Verify code formatting
      - name: Verify formatting
        run: dart format --output=none .

      # Run tests
      - name: Run unit tests
        run: flutter test

      # Clean and build APK
      - name: Clean build directory
        run: flutter clean

      - name: Build debug APK with env vars
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}

      # Firebase App Distribution (optional)
      - name: Decode Firebase credentials
        if: env.FIREBASE_APP_ID != ''
        run: echo "${{ secrets.FIREBASE_CREDENTIALS }}" | base64 --decode > ${{ github.workspace }}/firebase.json

      - name: Install Firebase CLI
        if: env.FIREBASE_APP_ID != ''
        run: |
          curl -sL https://firebase.tools | bash
          firebase --version

      - name: Upload to Firebase App Distribution
        if: env.FIREBASE_APP_ID != ''
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase.json
        run: |
          firebase appdistribution:distribute build/app/outputs/apk/debug/app-debug.apk \
            --app ${{ secrets.FIREBASE_APP_ID }} \
            --groups testers
