name: modular

packages:
  - .
  - packages/**

scripts:
  # Runs after melos bootstrap
  postbootstrap: >
    melos exec -- puro flutter pub get &&
    puro pub global activate git_hooks &&
    puro dart pub global activate full_coverage &&
    puro dart pub global activate flutter_gen &&
    puro dart pub global activate test_cov_console &&
    melos run dev:generate:native_splash &&
    melos run build_runner

  postclean: melos exec -- puro flutter clean

  # Analyze all packages
  analyze:
    run: melos exec -- puro flutter analyze .
    description: Run `flutter analyze` in all packages.
  # Generation i18n file
  dev:generate:i18n:
    run: melos exec --scope="banking_app" -- "puro flutter pub run intl_utils:generate"
    description: "Generation localizations"
    packageFilters:
      flutter: true
      scope:
        - banking_app

  # Generate DEV launcher icons
  generate:icon_launcher_dev:
    run: melos exec --scope="banking_app" -- puro flutter pub run flutter_launcher_icons:main -f flutter_launcher_icons_dev.yaml
    description: "Generate DEV launcher icons"

  # Generate PROD launcher icons
  generate:icon_launcher:
    run: melos exec --scope="banking_app" -- puro flutter pub run flutter_launcher_icons:main -f flutter_launcher_icons_prod.yaml
    description: "Generate PROD launcher icons"

  # Generate native splash
  dev:generate:native_splash:
    run: melos exec --scope="banking_app" -- puro flutter pub run flutter_native_splash:create
    description: "Generate splash screen"

  # Run build_runner for all code generation (Freezed, Isar, Envied, etc.)
  build_runner:
    run: melos exec --depends-on=build_runner -- "puro flutter pub run build_runner build --delete-conflicting-outputs"
    description: "Run build_runner to generate code"

  # Combined script for devs: clean + pub get + codegen
  codegen:
    run: melos run build_runner
    description: "Generate all necessary code for development"

  # Unit testing scripts
  test:selective_unit_test:
      run: |
        full_coverage
        puro flutter test --fail-fast --no-pub --coverage -r expanded
        lcov --remove coverage/lcov.info \
          'lib/main.dart' \
          'lib/main_device_preview.dart' \
          'lib/app/**' \
          'lib/core/**' \
          'lib/**/models/**' \
          'lib/**/repositories/**' \
          'lib/**/states/**' \
          'lib/features/account/**' \
          'lib/features/auth/**' \
          'lib/features/home/**' \
          'lib/features/setting/**' \
          'lib/features/landing/**' \
          'lib/features/message/**' \
          'lib/features/search/entities/**' \
          -o coverage/lcov.info
        genhtml coverage/lcov.info --output=coverage/html
        open coverage/html/index.html
      description: Run Flutter unit tests and generate selective coverage report
      packageFilters:
        flutter: true
        dirExists: test
        scope:
          - banking_app
