 image: gbcr.io/cirruslabs/flutter
  stages:
    - lints
    - test
  
  lints:
    stage: lints
    before_script:
      - bash reconfigure.sh
    script:
      - flutter analyze
    tags:
      - flutter

  unit tests:
    stage: test

    script:
      - flutter test --coverage
    artifacts:
      paths:
        - coverage/lcov.info
      reports:
        junit: test/test_results.xml
    tags:
      - flutter