name: laza
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # flutter_svg is a package in Flutter used to display and interact with Scalable Vector Graphics (SVG) images. 
  flutter_svg: ^2.0.10+1
  # Package providing flexible and easy-to-use routing management for Flutter apps.
  go_router: ^14.2.0
  # Package is a dart library that generates Dart localization code from ARB file. Generated code relies on Intl library.
  intl_utils: ^2.8.7
  # The intl package is a package in Flutter used to support language handling and numerical formatting within applications.
  intl: ^0.19.0

# Config gen assets
flutter_gen:
  output: lib/core/gen_assets/
  # Optional
  assert:
    packages_paramerter_enabled: true
    class_name: Assets
  integrations:
    flutter_svg: true

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.7
  flutter_gen_runner: ^5.6.0
  flutter_lints: ^3.0.0
  freezed: ^2.4.6


  device_preview: ^1.2.0


flutter:

  uses-material-design: true

  assets:
      - assets/images/
      - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600

  # Config i18n generation
flutter_intl:
  enabled: true
  arb_dir: lib/core/l10n
  output_dir: lib/core/l10n/l10n_generated

