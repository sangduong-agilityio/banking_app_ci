name: laza_design
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # flutter_svg is a package in Flutter used to display and interact with Scalable Vector Graphics (SVG) images. 
  flutter_svg: ^2.0.10+1

  laza:
      path: ../laza

# Config gen assets
flutter_gen:
  output: lib/core/gen_assets/
  # Optional
  assert:
    packages_paramerter_enabled: true
    class_name: Assets
  integrations:
    flutter_svg: true

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.7
  flutter_gen_runner: ^5.6.0
  flutter_lints: ^3.0.0
  freezed: ^2.4.6


flutter:
  uses-material-design: true

  assets:
      - assets/images/
      - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
